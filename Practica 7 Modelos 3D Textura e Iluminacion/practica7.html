  <script id="vs" type="vertex">
    #version 300 es
    uniform mat4 uMatrizProyeccion;
    uniform mat4 uMatrizVista;
    uniform mat4 uMatrizModelo;
    
    layout(location = 0) in vec3 aVertices;
    layout(location = 1) in vec3 aNormales;
    layout(location = 2) in vec2 aTexturas;
    
    out vec3 vNormales;
    out vec3 vPosicion;
    out vec2 vTexturas;
    
    void main() {
      vNormales = mat3(uMatrizModelo) * aNormales;
      vec4 posicionMundo = uMatrizModelo * vec4(aVertices, 1.0);
      vPosicion = posicionMundo.xyz;
      vTexturas = aTexturas;
      gl_Position = uMatrizProyeccion * uMatrizVista * posicionMundo;
    }
  </script>

  <script id="fs" type="fragment">
    #version 300 es
    precision highp float;
    
    in vec3 vNormales;
    in vec3 vPosicion;
    in vec2 vTexturas;
    
    uniform sampler2D uSampler;
    
    // NUEVAS VARIABLES DE ILUMINACIÓN PHONG
    uniform bool uIluminacionActiva;
    uniform vec3 uPosicionVista;
    uniform vec3 uPosicionLuz;
    uniform vec3 u_Ia;
    uniform vec3 u_Id;
    uniform vec3 u_Is;
    uniform vec3 u_ka;
    uniform vec3 u_kd;
    uniform vec3 u_ks;
    uniform float u_brillo;
    
    // VARIABLES PARA MODOS DE VISUALIZACIÓN
    uniform int uModoVisualizacion; // 0=puntos, 1=lineas, 2=material, 3=textura
    
    out vec4 color;
    
    void main() {
      vec3 normal = normalize(vNormales);
      vec4 colorTextura = texture(uSampler, vTexturas);
      
      // SEGÚN MODO DE VISUALIZACIÓN
      if (uModoVisualizacion == 0) { // PUNTOS
        color = vec4(1.0, 0.0, 0.0, 1.0); // Rojo para puntos
        return;
      }
      else if (uModoVisualizacion == 1) { // LÍNEAS
        color = vec4(0.0, 1.0, 0.0, 1.0); // Verde para líneas
        return;
      }
      else if (uModoVisualizacion == 2) { // MATERIAL (sin textura)
        if (uIluminacionActiva) {
          // CÁLCULO DE ILUMINACIÓN PHONG
          vec3 L = normalize(uPosicionLuz - vPosicion);
          vec3 V = normalize(uPosicionVista - vPosicion);
          vec3 H = normalize(L + V);
          
          // Factores de iluminación	
          float NL = max(0.0, dot(normal, L));
          float NH = max(0.0, dot(normal, H));
          
          // Calcula la luz ambiente
          vec3 luzAmbiente = u_ka * u_Ia;
          
          // Calcula la luz difusa
          vec3 luzDifusa = u_kd * u_Id * NL;
          
          // Calcula la luz especular
          vec3 luzEspecular = u_ks * u_Is * pow(NH, u_brillo);
          
          // Modelo de Phong
          vec3 rgb = luzAmbiente + luzDifusa + luzEspecular;
          color = vec4(rgb, 1.0);
        } else {
          // Sin iluminación - solo color del material
          color = vec4(u_kd, 1.0);
        }
      }
      else if (uModoVisualizacion == 3) { // TEXTURA
        if (uIluminacionActiva) {
          // CÁLCULO DE ILUMINACIÓN PHONG CON TEXTURA
          vec3 L = normalize(uPosicionLuz - vPosicion);
          vec3 V = normalize(uPosicionVista - vPosicion);
          vec3 H = normalize(L + V);
          
          // Factores de iluminación	
          float NL = max(0.0, dot(normal, L));
          float NH = max(0.0, dot(normal, H));
          
          // Calcula la luz ambiente
          vec3 luzAmbiente = u_ka * u_Ia;
          
          // Calcula la luz difusa (mezclada con textura)
          vec3 luzDifusa = colorTextura.rgb * u_Id * NL;
          
          // Calcula la luz especular
          vec3 luzEspecular = u_ks * u_Is * pow(NH, u_brillo);
          
          // Modelo de Phong con textura
          vec3 rgb = luzAmbiente + luzDifusa + luzEspecular;
          // USAMOS EL ALPHA DE LA TEXTURA
          color = vec4(rgb, colorTextura.a); 
        } else {
          // Sin iluminación - solo textura
          color = colorTextura;
        }
      }
    }
  </script>

  <script>
    "use strict";

    // Variables globales
    let canvas;
    let programaID;
    let gl;
    let modelos = [];
    let arcBall;

    // Variables Uniformes
    let uMatrizProyeccion;
    let uMatrizVista;
    let uMatrizModelo;
    
    // NUEVAS VARIABLES UNIFORMES PARA ILUMINACIÓN PHONG
    let uIluminacionActiva;
    let uPosicionVista;
    let uPosicionLuz;
    let u_Ia;
    let u_Id;
    let u_Is;
    let u_ka;
    let u_kd;
    let u_ks;
    let u_brillo;
    let uModoVisualizacion;

    // Matrices
    let MatrizProyeccion = new Array(16);
    let MatrizVista = new Array(16);
    let MatrizModelo = new Array(16);

    // Para la interacción
    let MatricesRotacion = [
      new Array(16), // Fall Guys
      new Array(16), // Castle
      new Array(16)  // Knight
    ];
    let B = new Array(16);
    let boton_izq_presionado = false;
    let modeloSeleccionado = 0; // Índice del modelo activo para rotación
    
    // Controla si el modelo debe ser dibujado
    let modelosVisibles = [false, false, false]; 

    // Para traslación con clic derecho
    let boton_der_presionado = false;
    let posicionInicialRatonX = 0;
    let posicionInicialRatonY = 0;
    
    // POSICIONES CENTRADAS
    let posicionesInicialesModelos = [
      [0, 0, 0], // Fall Guys (Centrado)
      [0, 0, 0], // Castle (Centrado)
      [0, 0, 0]  // Knight (Centrado)
    ];

    // Para las animaciones de cámara
    let anguloVertical = 0;
    let anguloHorizontal = 0;
    let distanciaCamara = 8;
    
    // Rotaciones independientes por modelo
    let rotacionesModelos = [
      { x: 0, y: 0, z: 0 }, // Fall Guys
      { x: 0, y: 0, z: 0 }, // Castle
      { x: 0, y: 0, z: 0 }  // Knight
    ];

    // Flags para rotación continua (SIMPLIFICADOS)
    let rotarXActivo = false;
    let rotarYActivo = false;
    let rotarZActivo = false;
    
    let zoomInActivo = false;
    let zoomOutActivo = false;
    let camaraArribaActiva = false;
    let camaraAbajoActiva = false;
    let camaraIzquierdaActiva = false;
    let camaraDerechaActiva = false;

    // Velocidad de animación
    const VELOCIDAD_ROTACION = 2;
    const VELOCIDAD_ZOOM = 0.2;
    const VELOCIDAD_CAMARA = 0.4;

    // NUEVAS VARIABLES PARA CONTROL DE ILUMINACIÓN Y VISUALIZACIÓN
    let iluminacionActiva = true;
    let modoVisualizacion = 3; // 0=puntos, 1=lineas, 2=material, 3=textura
    
    // Parámetros de iluminación Phong
    let posicionVista = [0, 0, 5];
    let posicionLuz = [5, 5, 5];
    let Ia = [0.2, 0.2, 0.2];  // Intensidad ambiental
    let Id = [1.0, 1.0, 1.0];  // Intensidad difusa  
    let Is = [1.0, 1.0, 1.0];  // Intensidad especular
    let ka = [0.5, 0.5, 0.5];  // Coeficiente ambiental (Default)
    let kd = [0.8, 0.8, 0.8];  // Coeficiente difuso (Default)
    let ks = [1.0, 1.0, 1.0];  // Coeficiente especular (Default)
    let brillo = 32.0;

    // Cargador de Texturas (Mantenido)
    function loadTexture(gl, url) {
      const texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texture);

      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
                    new Uint8Array([255, 255, 255, 255]));

      // Si no hay URL (modelo sin textura), mantén el pixel blanco y sal
      if (!url) return texture; 

      const image = new Image();
      image.onload = function() {
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);

        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
        
        gl.generateMipmap(gl.TEXTURE_2D);
      };
      // Esto es crucial para la carga asíncrona de texturas
      image.crossOrigin = ''; 
      image.src = url;

      return texture;
    }

    // OBJLoader (Mantenido con parseOBJ actualizado)
    class OBJLoader {
      async load(objPath, mtlPath) {
        try {
          const materiales = await this.loadMTL(mtlPath);
          const objResponse = await fetch(objPath);
          const objText = await objResponse.text();
          
          return this.parseOBJ(objText, materiales);
        } catch (error) {
          console.error('Error al cargar OBJ/MTL:', error);
          throw error;
        }
      }

      async loadMTL(mtlPath) {
        try {
          const response = await fetch(mtlPath);
          const text = await response.text();
          return this.parseMTL(text);
        } catch (error) {
          console.warn('No se pudo cargar MTL, usando color por defecto:', error);
          return { default: { Kd: [0.8, 0.8, 0.8], Ka: [0.2, 0.2, 0.2], Ks: [1.0, 1.0, 1.0], map_Kd: null } };
        }
      }

      parseMTL(text) {
        const materiales = {};
        let materialActual = null;

        const lineas = text.split('\n');
        for (let linea of lineas) {
          linea = linea.trim();
          if (linea.startsWith('#') || linea === '') continue;

          const partes = linea.split(/\s+/);
          const comando = partes[0];

          if (comando === 'newmtl') {
            materialActual = partes[1];
            materiales[materialActual] = {
              Ka: [0.2, 0.2, 0.2],
              Kd: [0.8, 0.8, 0.8],
              Ks: [1.0, 1.0, 1.0],
              map_Kd: null,
              Ns: 32.0 // Brillo especular
            };
          } else if (materialActual) {
            if (comando === 'Ka') {
              materiales[materialActual].Ka = [
                parseFloat(partes[1]),
                parseFloat(partes[2]),
                parseFloat(partes[3])
              ];
            } else if (comando === 'Kd') {
              materiales[materialActual].Kd = [
                parseFloat(partes[1]),
                parseFloat(partes[2]),
                parseFloat(partes[3])
              ];
            } else if (comando === 'Ks') {
              materiales[materialActual].Ks = [
                parseFloat(partes[1]),
                parseFloat(partes[2]),
                parseFloat(partes[3])
              ];
            } else if (comando === 'Ns') {
              materiales[materialActual].Ns = parseFloat(partes[1]);
            } else if (comando === 'map_Kd') {
              // map_Kd solo contiene el nombre del archivo de textura, no la ruta completa
              materiales[materialActual].map_Kd = partes[1]; 
            }
          }
        }

        for (const nombre in materiales) {
          const mat = materiales[nombre];
          if (!Array.isArray(mat.Kd) || mat.Kd.length !== 3 || mat.Kd.some(x => isNaN(x))) {
            mat.Kd = [0.8, 0.8, 0.8];
          }
        }

        return materiales;
      }

      // --- parseOBJ actualizado: genera submeshes por material ---
      parseOBJ(text, materiales) {

        // --- Datos temporales del OBJ ---
        const positions = [];
        const normals = [];
        const uvs = [];

        // Submeshes por material:
        const submeshes = {};

        let currentMaterial = "default";

        if (!materiales.default) {
            materiales.default = {
                Ka: [0.2, 0.2, 0.2],
                Kd: [0.8, 0.8, 0.8],
                Ks: [1.0, 1.0, 1.0],
                Ns: 32,
                map_Kd: null
            };
        }

        // Crear entrada para cada material
        function ensureSubmesh(matName) {
            if (!submeshes[matName]) {
                submeshes[matName] = {
                    material: materiales[matName] || materiales.default,
                    vertices: [],
                    normales: [],
                    texturas: []
                };
            }
        }
        ensureSubmesh("default");

        const lines = text.split("\n");

        for (let line of lines) {
            line = line.trim();
            if (line === "" || line.startsWith("#")) continue;

            const parts = line.split(/\s+/);
            const cmd = parts[0];

            if (cmd === "v") {
                positions.push(
                    parseFloat(parts[1]),
                    parseFloat(parts[2]),
                    parseFloat(parts[3])
                );
            }
            else if (cmd === "vn") {
                normals.push(
                    parseFloat(parts[1]),
                    parseFloat(parts[2]),
                    parseFloat(parts[3])
                );
            }
            else if (cmd === "vt") {
                uvs.push(
                    parseFloat(parts[1]),
                    parseFloat(parts[2])
                );
            }
            else if (cmd === "usemtl") {
                currentMaterial = parts[1];
                if (!materiales[currentMaterial]) {
                    currentMaterial = "default";
                }
                ensureSubmesh(currentMaterial);
            }
            else if (cmd === "f") {
                const face = parts.slice(1);

                // Triangulación (fan)
                for (let i = 1; i < face.length - 1; i++) {

                    const tri = [face[0], face[i], face[i + 1]];

                    for (let v of tri) {

                        const idx = v.split("/");

                        const vi = parseInt(idx[0]) - 1;
                        const ti = idx[1] ? parseInt(idx[1]) - 1 : null;
                        const ni = idx[2] ? parseInt(idx[2]) - 1 : null;

                        const sm = submeshes[currentMaterial];

                        // --- Vertex ---
                        sm.vertices.push(
                            positions[vi * 3],
                            positions[vi * 3 + 1],
                            positions[vi * 3 + 2]
                        );

                        // --- UV ---
                        if (ti !== null && uvs.length > 0) {
                            sm.texturas.push(
                                uvs[ti * 2],
                                1.0 - uvs[ti * 2 + 1]   // ← UV corregida
                            );
                        } else {
                            sm.texturas.push(0, 0);
                        }

                        // --- Normal ---
                        if (ni !== null && normals.length > 0) {
                            sm.normales.push(
                                normals[ni * 3],
                                normals[ni * 3 + 1],
                                normals[ni * 3 + 2]
                            );
                        } else {
                            sm.normales.push(0, 0, 1);
                        }
                    }
                }
            }
        }

        // Si algún submesh no tiene normales, generar normales
        for (let matName in submeshes) {
            const sm = submeshes[matName];

            const allZero = sm.normales.every(v => v === 0);
            if (allZero) {
                this.generateNormals(sm.vertices, sm.normales);
            }
        }

        return { submeshes };
      }

      generateNormals(vertices, normales) {
        for (let i = 0; i < vertices.length; i += 9) {
          const v1 = [vertices[i], vertices[i+1], vertices[i+2]];
          const v2 = [vertices[i+3], vertices[i+4], vertices[i+5]];
          const v3 = [vertices[i+6], vertices[i+7], vertices[i+8]];
          
          const u = [v2[0] - v1[0], v2[1] - v1[1], v2[2] - v1[2]];
          const v = [v3[0] - v1[0], v3[1] - v1[1], v3[2] - v1[2]];
          
          const normal = [
            u[1] * v[2] - u[2] * v[1],
            u[2] * v[0] - u[0] * v[2],
            u[0] * v[1] - u[1] * v[0]
          ];
          
          const len = Math.sqrt(normal[0]**2 + normal[1]**2 + normal[2]**2);
          if (len > 0) {
            normal[0] /= len;
            normal[1] /= len;
            normal[2] /= len;
          }
          
          for (let j = 0; j < 3; j++) {
            normales[i + j*3] = normal[0];
            normales[i + j*3 + 1] = normal[1];
            normales[i + j*3 + 2] = normal[2];
          }
        }
      }
    }

    // Modelo OBJ (actualizado para submeshes)
    class ModeloOBJ {
        constructor(gl, geometria, posicion, escala, indice, basePath) {
            this.gl = gl;
            this.posicion = posicion || [0,0,0];
            this.escala = escala || [1,1,1];
            this.indice = indice;
            this.submeshes = [];

            for (let matName in geometria.submeshes) {
                const sm = geometria.submeshes[matName];
                const mat = sm.material;

                // ---- Crear VAO ----
                const vao = gl.createVertexArray();
                gl.bindVertexArray(vao);

                // --- buffer posiciones ---
                const vb = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, vb);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(sm.vertices), gl.STATIC_DRAW);
                gl.enableVertexAttribArray(0);
                gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);

                // --- buffer normales ---
                const nb = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, nb);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(sm.normales), gl.STATIC_DRAW);
                gl.enableVertexAttribArray(1);
                gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);

                // --- buffer UV ---
                const tb = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, tb);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(sm.texturas), gl.STATIC_DRAW);
                gl.enableVertexAttribArray(2);
                gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 0, 0);

                gl.bindVertexArray(null);

                // --- cargar textura del material ---
                let tex = null;
                if (mat.map_Kd) {
                    tex = loadTexture(gl, basePath + mat.map_Kd);
                } else {
                    tex = loadTexture(gl, null);
                }

                this.submeshes.push({
                    vao,
                    count: sm.vertices.length / 3,
                    material: mat,
                    texture: tex
                });
            }
        }

        dibuja(gl) {
            for (let part of this.submeshes) {
                gl.bindVertexArray(part.vao);

                // Modo puntos o líneas: dibujamos sin textura ni iluminación
                if (modoVisualizacion === 0) {
                    gl.drawArrays(gl.POINTS, 0, part.count);
                    gl.bindVertexArray(null);
                    continue;
                }
                if (modoVisualizacion === 1) {
                    gl.drawArrays(gl.LINES, 0, part.count);
                    gl.bindVertexArray(null);
                    continue;
                }

                // --- textura ---
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, part.texture);
                gl.uniform1i(gl.getUniformLocation(gl.getParameter(gl.CURRENT_PROGRAM), "uSampler"), 0);

                // --- material Phong ---
                const m = part.material;
                gl.uniform3f(u_ka, m.Ka[0], m.Ka[1], m.Ka[2]);
                gl.uniform3f(u_kd, m.Kd[0], m.Kd[1], m.Kd[2]);
                gl.uniform3f(u_ks, m.Ks[0], m.Ks[1], m.Ks[2]);
                gl.uniform1f(u_brillo, m.Ns);

                // Dibujar triángulos normales
                gl.drawArrays(gl.TRIANGLES, 0, part.count);

                gl.bindVertexArray(null);
            }
        }
    }

    // Shaders (Mantenido)
    function compilaEnlazaLosShaders() {
      let shaderDeVertice = gl.createShader(gl.VERTEX_SHADER);
      gl.shaderSource(shaderDeVertice, document.getElementById("vs").text.trim());
      gl.compileShader(shaderDeVertice);
      if (!gl.getShaderParameter(shaderDeVertice, gl.COMPILE_STATUS)) {
         console.error(gl.getShaderInfoLog(shaderDeVertice));
      }

      let shaderDeFragmento = gl.createShader(gl.FRAGMENT_SHADER);
      gl.shaderSource(shaderDeFragmento, document.getElementById("fs").text.trim());
      gl.compileShader(shaderDeFragmento);
      if (!gl.getShaderParameter(shaderDeFragmento, gl.COMPILE_STATUS)) {
         console.error(gl.getShaderInfoLog(shaderDeFragmento));
      }

      programaID = gl.createProgram();
      gl.attachShader(programaID, shaderDeVertice); 
      gl.attachShader(programaID, shaderDeFragmento);
      gl.linkProgram(programaID);
      if (!gl.getProgramParameter(programaID, gl.LINK_STATUS)) {
         console.error(gl.getProgramInfoLog(programaID));
      }

      gl.useProgram(programaID);
      
      // OBTENER NUEVAS UNIFORMES
      uIluminacionActiva = gl.getUniformLocation(programaID, "uIluminacionActiva");
      uPosicionVista = gl.getUniformLocation(programaID, "uPosicionVista");
      uPosicionLuz = gl.getUniformLocation(programaID, "uPosicionLuz");
      u_Ia = gl.getUniformLocation(programaID, "u_Ia");
      u_Id = gl.getUniformLocation(programaID, "u_Id");
      u_Is = gl.getUniformLocation(programaID, "u_Is");
      u_ka = gl.getUniformLocation(programaID, "u_ka");
      u_kd = gl.getUniformLocation(programaID, "u_kd");
      u_ks = gl.getUniformLocation(programaID, "u_ks");
      u_brillo = gl.getUniformLocation(programaID, "u_brillo");
      uModoVisualizacion = gl.getUniformLocation(programaID, "uModoVisualizacion");
    }

    // Funciones de Transformaciones, Vector3, ArcBall, Cuaternion (Mantenidas)
    // ... (las mismas que tenías antes) ...
    function toRadians(grados) {
      return grados * Math.PI / 180;
    }

    function identidad(r) {
      r[0] = 1; r[4] = 0; r[ 8] = 0; r[12] = 0;
      r[1] = 0; r[5] = 1; r[ 9] = 0; r[13] = 0;
      r[2] = 0; r[6] = 0; r[10] = 1; r[14] = 0;
      r[3] = 0; r[7] = 0; r[11] = 0; r[15] = 1;
    }

    function traslacion(matriz, tx, ty, tz) {
      let r = new Array(16);
      r[0] = 1; r[4] = 0; r[ 8] = 0; r[12] = tx;
      r[1] = 0; r[5] = 1; r[ 9] = 0; r[13] = ty;
      r[2] = 0; r[6] = 0; r[10] = 1; r[14] = tz;
      r[3] = 0; r[7] = 0; r[11] = 0; r[15] =  1;
      multiplica(matriz, matriz, r);
    }

    function escalacion(matriz, sx, sy, sz) { 
      let r = new Array(16);
      r[0] = sx; r[4] =  0; r[ 8] =  0; r[12] =  0;
      r[1] =  0; r[5] = sy; r[9] =  0; r[13] =  0;
      r[2] =  0; r[6] =  0; r[10] = sz; r[14] =  0;
      r[3] =  0; r[7] =  0; r[11] =  0; r[15] =  1;
      multiplica(matriz, matriz, r);
    }

    function rotacionX(matriz, theta){
      let r = new Array(16);
      let c = Math.cos(toRadians(theta));
      let s = Math.sin(toRadians(theta));
      r[0] =  1; r[4] =  0; r[ 8] =  0; r[12] = 0;
      r[1] =  0; r[5] =  c; r[9] = -s; r[13] = 0;
      r[2] =  0; r[6] =  s; r[10] =  c; r[14] = 0;
      r[3] =  0; r[7] =  0; r[11] =  0; r[15] = 1;
      multiplica(matriz, matriz, r); 
    }

    function rotacionY(matriz, theta){
      let r = new Array(16);
      let c = Math.cos(toRadians(theta));
      let s = Math.sin(toRadians(theta));
      r[0] =  c; r[4] =  0; r[ 8] =  s; r[12] = 0;
      r[1] =  0; r[5] =  1; r[ 9] =  0; r[13] = 0;
      r[2] = -s; r[6] =  0; r[10] =  c; r[14] = 0;
      r[3] =  0; r[7] =  0; r[11] =  0; r[15] = 1;
      multiplica(matriz, matriz, r);
    }

    function rotacionZ(matriz, theta){
      let r = new Array(16);
      let c = Math.cos(toRadians(theta));
      let s = Math.sin(toRadians(theta));
      r[0] =  c; r[4] = -s; r[ 8] =  0; r[12] = 0;
      r[1] =  s; r[5] =  c; r[ 9] =  0; r[13] = 0;
      r[2] =  0; r[6] =  0; r[10] =  1; r[14] = 0;
      r[3] =  0; r[7] =  0; r[11] =  0; r[15] = 1;
      multiplica(matriz, matriz, r);
    }

    function perspective(r, fovy, aspecto, cerca, lejos) {
      let ang = fovy * 0.5;
      let f = (Math.abs(Math.sin(toRadians(ang))) < 1e-8 ? 0 : 1) / Math.tan(toRadians(ang));
      r[0] = f/aspecto; r[4] = 0; r[ 8] =                                  0; r[12] =                                       0;
      r[1] =         0; r[5] = f; r[9] =                                  0; r[13] =                                       0;
      r[2] =         0; r[6] = 0; r[10] = -(lejos + cerca) / (lejos - cerca); r[14] =  -2.0 * lejos * cerca / (lejos - cerca);
      r[3] =         0; r[7] = 0; r[11] =                              - 1.0; r[15] =                                       0;
    }

    function lookAt(matriz, eyeX, eyeY, eyeZ, centerX, centerY, centerZ, upX, upY, upZ) {
      let fx = centerX - eyeX;
      let fy = centerY - eyeY;
      let fz = centerZ - eyeZ;
      let rlf = 1.0 / Math.sqrt(fx*fx + fy*fy + fz*fz);
      fx *= rlf; fy *= rlf; fz *= rlf;

      let sx = fy * upZ - fz * upY;
      let sy = fz * upX - fx * upZ;
      let sz = fx * upY - fy * upX;
      let rls = 1.0 / Math.sqrt(sx*sx + sy*sy + sz*sz);
      sx *= rls; sy *= rls; sz *= rls;

      let ux = sy * fz - sz * fy;
      let uy = sz * fx - sx * fz;
      let uz = sx * fy - sy * fx;

      matriz[0] = sx; matriz[4] = ux; matriz[ 8] = -fx; matriz[12] = 0;
      matriz[1] = sy; matriz[5] = uy; matriz[ 9] = -fy; matriz[13] = 0;
      matriz[2] = sz; matriz[6] = uz; matriz[10] = -fz; matriz[14] = 0;
      matriz[3] = 0;  matriz[7] = 0;  matriz[11] =   0; matriz[15] = 1;

      traslacion(matriz, -eyeX, -eyeY, -eyeZ);
    }

    function multiplica(c, a, b) {
      let r = new Array(16);
      let i, j, k;
      for (i = 0; i < 4; i++){
        for (j = 0; j < 4; j++){
          let s = 0;
          for (k = 0; k < 4; k++)
            s = s + a[i + k * 4] * b[k + j * 4];
            r[i + j * 4] = s;
          }
        }
      for (i = 0; i < 16; i++)
        c[i] = r[i];
    }

    class Vector3 {
      constructor(x, y, z) {
        this.x = x || 0;
        this.y = y || 0;
        this.z = z || 0;
      }

      producto_vectorial(v2) {
        let r = new Vector3();
        r.x = (this.y * v2.z) - (this.z * v2.y);
        r.y = (this.z * v2.x) - (this.x * v2.z);
        r.z = (this.x * v2.y) - (this.y * v2.x);
        return r;
      }

      producto_escalar(v2) {
        return (this.x * v2.x) + (this.y * v2.y) + (this.z * v2.z);
      }

      longitud() {
        return (Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z));
      }
    }
  
    class ArcBall {
      constructor(w, h) {
        this.Epsilon = 1.0e-5;
        this.U = new Vector3();
        this.V = new Vector3();
        this.ajusta(w, h);
      }

      ajusta(w, h) {
        if (!((w > 1.0) && (h > 1.0)))
          console.error("ERROR en ArcBall.ajusta");

        this.ajustaAncho = 2.0 / (w - 1.0);
        this.ajustaAlto = 2.0 / (h - 1.0);
      }

      obtieneVector(vector, x, y) {
        let tempX = (x * this.ajustaAncho) - 1.0;
        let tempY = 1.0 - (y * this.ajustaAlto);

        let longitud2 = (tempX * tempX) + (tempY * tempY);

        if (longitud2 > 1.0) {
          let norma = (1.0 / Math.sqrt(longitud2));
          vector.x = tempX * norma;
          vector.y = tempY * norma;
          vector.z = 0.0;
        } else {
          vector.x = tempX;
          vector.y = tempY;
          vector.z = Math.sqrt(1.0 - longitud2);
        }
      }

      primerPunto(x, y) {
        this.obtieneVector(this.U, x, y);
      }

      segundoPunto(x, y) {
        let q = { x: 0, y: 0, z: 0, w: 0 };
        this.obtieneVector(this.V, x, y);

        let Normal = this.U.producto_vectorial(this.V);

        if (Normal.longitud() > this.Epsilon) {
          q.x = Normal.x;
          q.y = Normal.y;
          q.z = Normal.z;
          q.w = this.U.producto_escalar(this.V);
        } else {
          q.x = q.y = q.z = q.w = 0.0;
        }
        return q;
      }
    }
  
    function rotaConCuaternion(a, q) {
      let d, s;
      d = (q.x * q.x) + (q.y * q.y) + (q.z * q.z) + (q.w * q.w);
      s = (d > 0.0) ? (2.0 / d) : 0.0;
      a[0] =  1.0 - (q.y*q.y + q.z*q.z) * s; a[4] =        (q.x*q.y - q.w*q.z) * s; a[8]  =        (q.x*q.z + q.w*q.y) * s; a[12] = 0;
      a[1] =        (q.x*q.y + q.w*q.z) * s; a[5] = 1.0  - (q.x*q.x + q.z*q.z) * s; a[9]  =        (q.y*q.z - q.w*q.x) * s; a[13] = 0;
      a[2] =        (q.x*q.z - q.w*q.y) * s; a[6] =        (q.y*q.z + q.w*q.x) * s; a[10] = 1.0  - (q.x*q.x + q.y*q.y) * s; a[14] = 0;
      a[3] =                              0; a[7] =                              0; a[11] =                              0; a[15] = 1;
    }

    // Eventos del Ratón (Mantenidos)
    function mouseDown(event) {
      const rect = canvas.getBoundingClientRect();
      let posx = event.clientX - rect.left;
      let posy = event.clientY - rect.top;

      if (event.button === 0) {
        // Al hacer clic, si el modelo seleccionado no es visible, 
        // cambiamos el modeloSeleccionado al que esté activo actualmente.
        let modeloActivoIndex = modelosVisibles.findIndex(v => v);
        if (modeloActivoIndex !== -1) {
             modeloSeleccionado = modeloActivoIndex;
        }

        B = MatricesRotacion[modeloSeleccionado].slice();
        arcBall.primerPunto(posx, posy);
        boton_izq_presionado = true;
      }
      else if (event.button === 2) {
        posicionInicialRatonX = posx;
        posicionInicialRatonY = posy;
        boton_der_presionado = true;
        
        for (let i = 0; i < modelos.length; i++) {
          // Guardamos la posición actual, no la inicial, para que el drag funcione
          posicionesInicialesModelos[i] = [...modelos[i].posicion];
        }
      }
      
      event.preventDefault();
      return false;
    }

    function mouseUp(e){
      boton_izq_presionado = false;
      boton_der_presionado = false;
    }

    function mouseMove(event) {
      const rect = canvas.getBoundingClientRect();
      let posx = event.clientX - rect.left;
      let posy = event.clientY - rect.top;

      if (boton_izq_presionado) {
        let q = arcBall.segundoPunto(posx, posy);
        rotaConCuaternion(MatricesRotacion[modeloSeleccionado], q);
        multiplica(MatricesRotacion[modeloSeleccionado], MatricesRotacion[modeloSeleccionado], B);
      }
      else if (boton_der_presionado) {
        const deltaX = (posx - posicionInicialRatonX) * 0.01;
        const deltaY = -(posy - posicionInicialRatonY) * 0.01;
        
        // Trasladar solo el modelo seleccionado
        modelos[modeloSeleccionado].posicion[0] = posicionesInicialesModelos[modeloSeleccionado][0] + deltaX;
        modelos[modeloSeleccionado].posicion[1] = posicionesInicialesModelos[modeloSeleccionado][1] + deltaY;
      }
      
      event.preventDefault();
    }

    function mouseWheel(event) {
      event.preventDefault();
      if (event.deltaY < 0) {
        distanciaCamara = Math.max(3, distanciaCamara - VELOCIDAD_ZOOM * 3);
      } else {
        distanciaCamara = Math.min(30, distanciaCamara + VELOCIDAD_ZOOM * 3);
      }
      return false;
    }

    // NUEVA FUNCIÓN: Carga y selección de modelo
    function cargarModelo(index) {
        if (index >= modelos.length) return;

        // 1. Ocultar todos los modelos y limpiar el estado de botones de carga
        const botonesCarga = ['cargarFallGuys', 'cargarCastle', 'cargarKnight'];
        modelosVisibles.fill(false);
        botonesCarga.forEach(id => document.getElementById(id).classList.remove('activo'));
        
        // 2. Mostrar solo el modelo seleccionado y activar su botón
        modelosVisibles[index] = true;
        document.getElementById(botonesCarga[index]).classList.add('activo');

        // 3. Asignar el modelo seleccionado para las rotaciones
        modeloSeleccionado = index;
        
        // 4. Asegurarse de que la rotación actual del modelo seleccionado
        //    se use como base para el ArcBall al hacer clic
        B = MatricesRotacion[modeloSeleccionado].slice();

        // 5. Restablecer la posición del modelo seleccionado a [0, 0, 0] 
        //    para asegurar que esté centrado al cambiar de modelo.
        modelos[modeloSeleccionado].posicion = [0, 0, 0];
        
        // 6. Asegurarse de que no haya rotaciones automáticas activas
        rotarXActivo = false;
        rotarYActivo = false;
        rotarZActivo = false;
        actualizaBotonActivo('rotarX', false);
        actualizaBotonActivo('rotarY', false);
        actualizaBotonActivo('rotarZ', false);
    }

    function cambiarModoVisualizacion(nuevoModo) {

    function actualizarControlesIluminacion() {
      gl.uniform1i(uIluminacionActiva, iluminacionActiva);
      gl.uniform3f(uPosicionVista, posicionVista[0], posicionVista[1], posicionVista[2]);
      gl.uniform3f(uPosicionLuz, posicionLuz[0], posicionLuz[1], posicionLuz[2]);
      gl.uniform3f(u_Ia, Ia[0], Ia[1], Ia[2]);
      gl.uniform3f(u_Id, Id[0], Id[1], Id[2]);
      gl.uniform3f(u_Is, Is[0], Is[1], Is[2]);
      // Los coeficientes ka, kd, ks se actualizan dentro del bucle dibuja para cada modelo.
      gl.uniform1f(u_brillo, brillo);
      gl.uniform1i(uModoVisualizacion, modoVisualizacion);
    }

    function actualizarCamara() {
      let radianes_h = toRadians(anguloHorizontal);
      let radianes_v = toRadians(anguloVertical);
      
      let camX = distanciaCamara * Math.cos(radianes_v) * Math.sin(radianes_h);
      let camY = distanciaCamara * Math.sin(radianes_v);
      let camZ = distanciaCamara * Math.cos(radianes_v) * Math.cos(radianes_h);

      posicionVista = [camX, camY, camZ];
      
      identidad(MatrizVista);
      lookAt(MatrizVista, camX, camY, camZ, 0, 0, 0, 0, 1, 0);
      gl.uniformMatrix4fv(uMatrizVista, false, MatrizVista);
    }

    // -------------------------
    //      FUNCIÓN dibuja()
    // -------------------------
    function dibuja() {
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        if (modelos.length === 0) {
            requestAnimationFrame(dibuja);
            return;
        }

        actualizarControlesIluminacion();

        // Animaciones de rotación del modelo seleccionado
        if (rotarXActivo) rotacionesModelos[modeloSeleccionado].x += VELOCIDAD_ROTACION;
        if (rotarYActivo) rotacionesModelos[modeloSeleccionado].y += VELOCIDAD_ROTACION;
        if (rotarZActivo) rotacionesModelos[modeloSeleccionado].z += VELOCIDAD_ROTACION;

        // Animaciones de zoom
        if (zoomInActivo) distanciaCamara = Math.max(3, distanciaCamara - VELOCIDAD_ZOOM);
        if (zoomOutActivo) distanciaCamara = Math.min(30, distanciaCamara + VELOCIDAD_ZOOM);

        // Animaciones de cámara
        if (camaraArribaActiva) {
            anguloVertical -= VELOCIDAD_CAMARA;
            if (anguloVertical < -89) anguloVertical = -89;
        }
        if (camaraAbajoActiva) {
            anguloVertical += VELOCIDAD_CAMARA;
            if (anguloVertical > 89) anguloVertical = 89;
        }
        if (camaraIzquierdaActiva) anguloHorizontal += VELOCIDAD_CAMARA;
        if (camaraDerechaActiva) anguloHorizontal -= VELOCIDAD_CAMARA;

        // Normalizar rotaciones
        for (let i = 0; i < 3; i++) {
            if (rotacionesModelos[i].x >= 360) rotacionesModelos[i].x -= 360;
            if (rotacionesModelos[i].y >= 360) rotacionesModelos[i].y -= 360;
            if (rotacionesModelos[i].z >= 360) rotacionesModelos[i].z -= 360;
        }

        actualizarCamara();

        // -------------------------
        //      DIBUJAR MODELOS
        // -------------------------
        for (let i = 0; i < modelos.length; i++) {

            if (!modelosVisibles[i]) continue;

            const modelo = modelos[i];

            // Matriz modelo
            identidad(MatrizModelo);
            traslacion(MatrizModelo, modelo.posicion[0], modelo.posicion[1], modelo.posicion[2]);
            escalacion(MatrizModelo, modelo.escala[0], modelo.escala[1], modelo.escala[2]);

            rotacionX(MatrizModelo, rotacionesModelos[i].x);
            rotacionY(MatrizModelo, rotacionesModelos[i].y);
            rotacionZ(MatrizModelo, rotacionesModelos[i].z);

            multiplica(MatrizModelo, MatrizModelo, MatricesRotacion[i]);

            gl.uniformMatrix4fv(uMatrizModelo, false, MatrizModelo);


            // ==========================================================
            //   🔥 SOPORTE REAL PARA MUCHOS MATERIALES / MUCHAS TEXTURAS
            // ==========================================================
            for (let part of modelo.submeshes) {

                gl.bindVertexArray(part.vao);

                // Modo de puntos o líneas
                if (modoVisualizacion === 0) { 
                    gl.drawArrays(gl.POINTS, 0, part.count);
                    gl.bindVertexArray(null);
                    continue;
                }
                if (modoVisualizacion === 1) { 
                    gl.drawArrays(gl.LINES, 0, part.count);
                    gl.bindVertexArray(null);
                    continue;
                }

                // --- textura ---
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, part.texture);
                gl.uniform1i(gl.getUniformLocation(gl.getParameter(gl.CURRENT_PROGRAM), "uSampler"), 0);

                // --- material Phong ---
                let m = part.material;
                gl.uniform3f(u_ka, m.Ka[0], m.Ka[1], m.Ka[2]);
                gl.uniform3f(u_kd, m.Kd[0], m.Kd[1], m.Kd[2]);
                gl.uniform3f(u_ks, m.Ks[0], m.Ks[1], m.Ks[2]);
                gl.uniform1f(u_brillo, m.Ns);

                // Dibujar triángulos normales
                gl.drawArrays(gl.TRIANGLES, 0, part.count);

                gl.bindVertexArray(null);
            }
        }

        requestAnimationFrame(dibuja);
    }

    function reinicia() {
      for (let i = 0; i < 3; i++) {
        identidad(MatricesRotacion[i]);
        rotacionesModelos[i] = { x: 0, y: 0, z: 0 };
        // Si el modelo existe, restaura su posición (ahora a [0, 0, 0])
        if (modelos[i]) {
          modelos[i].posicion = [0, 0, 0]; 
        }
      }
      
      anguloVertical = 0;
      anguloHorizontal = 0;
      distanciaCamara = 8;
      
      // Reinicio de flags generalizados
      rotarXActivo = false;
      rotarYActivo = false;
      rotarZActivo = false;
      
      zoomInActivo = false;
      zoomOutActivo = false;
      camaraArribaActiva = false;
      camaraAbajoActiva = false;
      camaraIzquierdaActiva = false;
      camaraDerechaActiva = false;
      
      // Restaurar control de visibilidad: selecciona el primer modelo
      cargarModelo(0); 

      // Restaurar controles de visualización
      iluminacionActiva = true;
      modoVisualizacion = 3;
      
      document.getElementById("toggleIluminacion").checked = true;
      cambiarModoVisualizacion(3);
      
      // Limpiar el estado 'activo' de todos los botones de animación/zoom
      document.querySelectorAll('button.activo').forEach(btn => {
        if (!btn.id.startsWith('modo') && !btn.id.startsWith('cargar')) {
          btn.classList.remove('activo');
        }
      });
    }

    // Inicialización (ACTUALIZADA)
    async function main() {
      canvas = document.getElementById("webglcanvas");
      gl = canvas.getContext("webgl2");
      if (!gl) {
         document.write("WebGL 2.0 no está disponible en tu navegador");
         return;
      }

      // Ajustar tamaño del canvas
      canvas.width = window.innerWidth - 320;
      canvas.height = window.innerHeight;

      // Event listeners (Mantenidos)
      canvas.addEventListener("mousedown", mouseDown, false);
      canvas.addEventListener("mouseup", mouseUp, false);
      canvas.addEventListener("mouseout", mouseUp, false);
      canvas.addEventListener("mousemove", mouseMove, false);
      canvas.addEventListener("wheel", mouseWheel, false);
      
      canvas.addEventListener('contextmenu', function(event) {
        event.preventDefault();
        return false;
      });

      // EVENT LISTENERS PARA CONTROLES (Mantenidos)
      document.getElementById("cargarFallGuys").addEventListener('click', () => cargarModelo(0));
      document.getElementById("cargarCastle").addEventListener('click', () => cargarModelo(1));
      document.getElementById("cargarKnight").addEventListener('click', () => cargarModelo(2));
      document.getElementById("modoPuntos").addEventListener('click', () => cambiarModoVisualizacion(0));
      document.getElementById("modoLineas").addEventListener('click', () => cambiarModoVisualizacion(1));
      document.getElementById("modoMaterial").addEventListener('click', () => cambiarModoVisualizacion(2));
      document.getElementById("modoTextura").addEventListener('click', () => cambiarModoVisualizacion(3));
      document.getElementById("toggleIluminacion").addEventListener('change', function(e) {
        iluminacionActiva = e.target.checked;
        console.log(`💡 Iluminación ${iluminacionActiva ? 'activada' : 'desactivada'}`);
      });
      document.getElementById("reset").onclick = reinicia;
      document.getElementById("rotarArriba").onclick = animarCamaraArriba;
      document.getElementById("rotarAbajo").onclick = animarCamaraAbajo;
      document.getElementById("rotarIzquierda").onclick = animarCamaraIzquierda;
      document.getElementById("rotarDerecha").onclick = animarCamaraDerecha;
      document.getElementById("zoomIn").onclick = animarZoomIn;
      document.getElementById("zoomOut").onclick = animarZoomOut;
      document.getElementById("rotarX").onclick = animarRotacionX;
      document.getElementById("rotarY").onclick = animarRotacionY;
      document.getElementById("rotarZ").onclick = animarRotacionZ;

      gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
      compilaEnlazaLosShaders();

      arcBall = new ArcBall(canvas.width, canvas.height);

      gl.useProgram(programaID);
      uMatrizProyeccion = gl.getUniformLocation(programaID, "uMatrizProyeccion");
      uMatrizVista = gl.getUniformLocation(programaID, "uMatrizVista");
      uMatrizModelo = gl.getUniformLocation(programaID, "uMatrizModelo");
      
      perspective(MatrizProyeccion, 45, canvas.width / canvas.height, 0.1, 100);
      gl.uniformMatrix4fv(uMatrizProyeccion, false, MatrizProyeccion);
      
      identidad(MatrizVista);
      gl.uniformMatrix4fv(uMatrizVista, false, MatrizVista);
      
      for (let i = 0; i < 3; i++) {
        identidad(MatricesRotacion[i]);
      }

      arcBall.ajusta(gl.canvas.width, gl.canvas.height);

      // --- CONFIGURACIÓN GRÁFICA CLAVE ---
      gl.enable(gl.DEPTH_TEST);
      
      // Habilitar el descarte de caras traseras
      gl.enable(gl.CULL_FACE); 
      gl.cullFace(gl.BACK);

      // Habilitar la mezcla (blending) para manejar la transparencia de las texturas (alpha)
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      // -------------------------------------------------------------------
      
      gl.clearColor(0.1, 0.1, 0.1, 1.0);
      gl.enable(gl.PROGRAM_POINT_SIZE);
      gl.enable(gl.LINE_WIDTH);

      cambiarModoVisualizacion(3); 
      actualizarControlesIluminacion();

      const loader = new OBJLoader();
      
      // MODIFICACIÓN DE RUTAS PARA USAR CARPETAS INDIVIDUALES
      const modelosConfig = [
        { 
          obj: 'modelos/fall_guys/chai_hi-fi_rush_-_fall_guys_skin.obj', 
          mtl: 'modelos/fall_guys/chai_hi-fi_rush_-_fall_guys_skin.mtl', 
          posicion: [0, 0, 0], 
          escala: [0.1, 0.1, 0.1],
          // Nueva ruta base para la textura, que es relativa al HTML
          basePath: 'modelos/fall_guys/' 
        },
        { 
          obj: 'modelos/castle/castle.obj', 
          mtl: 'modelos/castle/castle.mtl', 
          posicion: [0, 0, 0], 
          escala: [5, 5, 5],
          basePath: 'modelos/castle/' 
        },
        { 
          obj: 'modelos/knight/fall_guys_trice.obj', 
          mtl: 'modelos/knight/fall_guys_trice.mtl', 
          posicion: [0, 0, 0], 
          escala: [0.1, 0.1, 0.1],
          basePath: 'modelos/knight/' 
        }
      ];
      // -------------------------------------------------------------------

      let cargados = 0;
      const loadingEl = document.getElementById('loading');

      try {
        for (let i = 0; i < modelosConfig.length; i++) {
          const config = modelosConfig[i];
          if (loadingEl) {
            loadingEl.textContent = `🎮 Cargando modelo ${i + 1} de 3...`;
          }
          
          try {
            const geometria = await loader.load(config.obj, config.mtl);
            
            // Construir modelo pasando escala y basePath
            const modelo = new ModeloOBJ(gl, geometria, config.posicion, config.escala, i, config.basePath);
            modelos.push(modelo);
            cargados++;
            console.log(`Modelo ${i + 1} cargado correctamente`);
          } catch (error) {
            console.error(`Error al cargar modelo ${i + 1}:`, error);
          }
        }
        
        // Configuración inicial de visibilidad después de la carga
        if (cargados > 0) {
            cargarModelo(0); // Cargar y mostrar el primer modelo por defecto

            if (loadingEl) {
              loadingEl.innerHTML = '¡Modelos cargados!<br>🎮 Usa los botones de carga para cambiar de modelo';
              setTimeout(() => { loadingEl.style.display = 'none'; }, 2000);
            }
        } else {
            // Manejo de errores de carga (Ruta de error actualizada)
            if (loadingEl) {
              loadingEl.innerHTML = 
                'No se pudieron cargar los modelos<br><br>' +
                'Verifica:<br>' +
                '1. Que los archivos .obj, .mtl y .png estén en subcarpetas dentro de "modelos/" (ej: "modelos/fall_guys/")<br>' +
                '2. Que los nombres coincidan con los especificados en el código<br>' +
                '3. Que estés usando un servidor local (no file://)';
            }
        }
      } catch (error) {
        console.error('Error general:', error);
        if (loadingEl) {
          loadingEl.textContent = 'Error: ' + error.message;
        }
      }

      dibuja();
    }

    window.onload = main;
  </script>
</body>
