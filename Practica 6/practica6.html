  <!-- Shaders -->
  <script id="vs" type="vertex">
    #version 300 es
    uniform mat4 uMatrizProyeccion;
    uniform mat4 uMatrizVista;
    uniform mat4 uMatrizModelo;
    
    layout(location = 0) in vec3 aVertices;
    layout(location = 1) in vec3 aNormales;
    layout(location = 2) in vec2 aTexturas;
    
    out vec3 vNormales;
    out vec3 vPosicion;
    out vec2 vTexturas;
    
    void main() {
      vNormales = mat3(uMatrizModelo) * aNormales;
      vec4 posicionMundo = uMatrizModelo * vec4(aVertices, 1.0);
      vPosicion = posicionMundo.xyz;
      vTexturas = aTexturas;
      gl_Position = uMatrizProyeccion * uMatrizVista * posicionMundo;
    }
  </script>
  <script id="fs" type="fragment">
    #version 300 es
    precision highp float;
    
    in vec3 vNormales;
    in vec3 vPosicion;
    in vec2 vTexturas;
    
    uniform sampler2D uSampler;
    
    out vec4 color;
    
    void main() {
      vec3 normal = normalize(vNormales);
      vec3 luzDir = normalize(vec3(1.0, 1.0, 1.0));
      float difusa = max(dot(normal, luzDir), 0.0);
      
      vec3 ambiente = vec3(0.3, 0.3, 0.3);
      vec4 colorTextura = texture(uSampler, vTexturas);
      vec3 colorFinal = colorTextura.rgb * (ambiente + difusa * 0.7);
      
      color = vec4(colorFinal, colorTextura.a);
    }
  </script>

  <script>
    "use strict";

    // Variables globales
    let canvas;
    let programaID;
    let gl;
    let modelos = [];
    let arcBall;

    // Variables Uniformes
    let uMatrizProyeccion;
    let uMatrizVista;
    let uMatrizModelo;

    // Matrices
    let MatrizProyeccion = new Array(16);
    let MatrizVista = new Array(16);
    let MatrizModelo = new Array(16);

    // Para la interacción - AHORA POR MODELO
    let MatricesRotacion = [
      new Array(16), // Fall Guys
      new Array(16), // Castle
      new Array(16)  // Knight
    ];
    let B = new Array(16);
    let boton_izq_presionado = false;
    let modeloSeleccionado = 0; // 0=Fall Guys, 1=Castle, 2=Knight

    // Para traslación con clic derecho
    let boton_der_presionado = false;
    let posicionInicialRatonX = 0;
    let posicionInicialRatonY = 0;
    let posicionesInicialesModelos = [
      [-3, -2.0, 0], // Fall Guys
      [0, -1.0, 0],  // Castle
      [3, -1.0, 0]   // Knight
    ];

    // Para las animaciones de cámara
    let anguloVertical = 0;
    let anguloHorizontal = 0;
    let distanciaCamara = 8;
    
    //Rotaciones independientes por modelo
    let rotacionesModelos = [
      { x: 0, y: 0, z: 0 }, // Fall Guys
      { x: 0, y: 0, z: 0 }, // Castle
      { x: 0, y: 0, z: 0 }  // Knight
    ];

    // Flags para rotación continua - AHORA POR MODELO
    let rotarXActivo = false;  // Fall Guys (izquierda)
    let rotarYActivo = false;  // Knight (derecha)
    let rotarZActivo = false;  // Castle (centro)
    
    // Nuevas variables para rotaciones individuales
    let rotarFallGuysXActivo = false;
    let rotarFallGuysYActivo = false;
    let rotarFallGuysZActivo = false;
    let rotarCastleXActivo = false;
    let rotarCastleYActivo = false;  
    let rotarCastleZActivo = false;
    let rotarKnightXActivo = false;
    let rotarKnightYActivo = false;
    let rotarKnightZActivo = false;
    
    let zoomInActivo = false;
    let zoomOutActivo = false;
    let camaraArribaActiva = false;
    let camaraAbajoActiva = false;
    let camaraIzquierdaActiva = false;
    let camaraDerechaActiva = false;

    // Velocidad de animación
    const VELOCIDAD_ROTACION = 2;
    const VELOCIDAD_ZOOM = 0.2;
    const VELOCIDAD_CAMARA = 0.4;

    // Cargador de Texturas
    function loadTexture(gl, url) {
      const texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texture);

      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
                    new Uint8Array([255, 255, 255, 255]));

      const image = new Image();
      image.onload = function() {
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);

        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
        
        gl.generateMipmap(gl.TEXTURE_2D);
      };
      image.src = url;

      return texture;
    }

    // Cargador OBJ
    class OBJLoader {
      async load(objPath, mtlPath) {
        try {
          const materiales = await this.loadMTL(mtlPath);
          const objResponse = await fetch(objPath);
          const objText = await objResponse.text();
          
          return this.parseOBJ(objText, materiales);
        } catch (error) {
          console.error('Error al cargar OBJ/MTL:', error);
          throw error;
        }
      }

      async loadMTL(mtlPath) {
        try {
          const response = await fetch(mtlPath);
          const text = await response.text();
          return this.parseMTL(text);
        } catch (error) {
          console.warn('No se pudo cargar MTL, usando color por defecto:', error);
          return { default: { Kd: [0.8, 0.8, 0.8] } };
        }
      }

      parseMTL(text) {
        const materiales = {};
        let materialActual = null;

        const lineas = text.split('\n');
        for (let linea of lineas) {
          linea = linea.trim();
          if (linea.startsWith('#') || linea === '') continue;

          const partes = linea.split(/\s+/);
          const comando = partes[0];

          if (comando === 'newmtl') {
            materialActual = partes[1];
            materiales[materialActual] = {
              Ka: [0.2, 0.2, 0.2],
              Kd: [0.8, 0.8, 0.8],
              Ks: [1.0, 1.0, 1.0],
              map_Kd: null
            };
          } else if (materialActual) {
            if (comando === 'Ka') {
              materiales[materialActual].Ka = [
                parseFloat(partes[1]),
                parseFloat(partes[2]),
                parseFloat(partes[3])
              ];
            } else if (comando === 'Kd') {
              materiales[materialActual].Kd = [
                parseFloat(partes[1]),
                parseFloat(partes[2]),
                parseFloat(partes[3])
              ];
            } else if (comando === 'Ks') {
              materiales[materialActual].Ks = [
                parseFloat(partes[1]),
                parseFloat(partes[2]),
                parseFloat(partes[3])
              ];
            } else if (comando === 'map_Kd') {
              materiales[materialActual].map_Kd = partes[1];
            }
          }
        }

        for (const nombre in materiales) {
          const mat = materiales[nombre];
          if (!Array.isArray(mat.Kd) || mat.Kd.length !== 3 || mat.Kd.some(x => isNaN(x))) {
            mat.Kd = [0.8, 0.8, 0.8];
          }
        }

        return materiales;
      }

      parseOBJ(text, materiales) {
        const vertices = [];
        const normales = [];
        const texturas = [];
        const faces = [];
        
        let materialActual = 'default';
        if (!materiales.default) {
          materiales.default = { Kd: [0.8, 0.6, 0.4], map_Kd: null };
        }

        const lineas = text.split('\n');
        for (let linea of lineas) {
          linea = linea.trim();
          if (linea.startsWith('#') || linea === '') continue;

          const partes = linea.split(/\s+/);
          const comando = partes[0];

          if (comando === 'v') {
            vertices.push(
              parseFloat(partes[1]),
              parseFloat(partes[2]),
              parseFloat(partes[3])
            );
          } else if (comando === 'vn') {
            normales.push(
              parseFloat(partes[1]),
              parseFloat(partes[2]),
              parseFloat(partes[3])
            );
          } else if (comando === 'vt') {
            texturas.push(
              parseFloat(partes[1]),
              parseFloat(partes[2])
            );
          } else if (comando === 'usemtl') {
            materialActual = partes[1];
            if (!materiales[materialActual]) {
              materialActual = 'default';
            }
          } else if (comando === 'f') {
            const cara = [];
            for (let i = 1; i < partes.length; i++) {
              const indices = partes[i].split('/');
              cara.push({
                v: parseInt(indices[0]) - 1,
                vt: indices[1] ? parseInt(indices[1]) - 1 : null,
                vn: indices[2] ? parseInt(indices[2]) - 1 : null,
                material: materialActual
              });
            }
            faces.push(cara);
          }
        }

        const verticesFinales = [];
        const normalesFinales = [];
        const texturasFinales = [];
        const infoMateriales = {};

        for (let cara of faces) {
          for (let i = 1; i < cara.length - 1; i++) {
            const indices = [0, i, i + 1];
            
            for (let idx of indices) {
              const v = cara[idx];
              
              verticesFinales.push(
                vertices[v.v * 3],
                vertices[v.v * 3 + 1],
                vertices[v.v * 3 + 2]
              );

              if (v.vn !== null && normales.length > 0) {
                normalesFinales.push(
                  normales[v.vn * 3],
                  normales[v.vn * 3 + 1],
                  normales[v.vn * 3 + 2]
                );
              } else {
                normalesFinales.push(0, 0, 0);
              }

              if (v.vt !== null && texturas.length > 0) {
                texturasFinales.push(
                  texturas[v.vt * 2],
                  texturas[v.vt * 2 + 1]
                );
              } else {
                texturasFinales.push(0, 0);
              }

              const mat = materiales[v.material] || materiales.default;
              infoMateriales[cara[0].material] = mat;
            }
          }
        }

        if (normalesFinales.every(n => n === 0)) {
          this.generateNormals(verticesFinales, normalesFinales);
        }

        return {
          vertices: new Float32Array(verticesFinales),
          normales: new Float32Array(normalesFinales),
          texturas: new Float32Array(texturasFinales),
          materiales: infoMateriales
        };
      }

      generateNormals(vertices, normales) {
        for (let i = 0; i < vertices.length; i += 9) {
          const v1 = [vertices[i], vertices[i+1], vertices[i+2]];
          const v2 = [vertices[i+3], vertices[i+4], vertices[i+5]];
          const v3 = [vertices[i+6], vertices[i+7], vertices[i+8]];
          
          const u = [v2[0] - v1[0], v2[1] - v1[1], v2[2] - v1[2]];
          const v = [v3[0] - v1[0], v3[1] - v1[1], v3[2] - v1[2]];
          
          const normal = [
            u[1] * v[2] - u[2] * v[1],
            u[2] * v[0] - u[0] * v[2],
            u[0] * v[1] - u[1] * v[0]
          ];
          
          const len = Math.sqrt(normal[0]**2 + normal[1]**2 + normal[2]**2);
          if (len > 0) {
            normal[0] /= len;
            normal[1] /= len;
            normal[2] /= len;
          }
          
          for (let j = 0; j < 3; j++) {
            normales[i + j*3] = normal[0];
            normales[i + j*3 + 1] = normal[1];
            normales[i + j*3 + 2] = normal[2];
          }
        }
      }
    }

    // Modelo OBJ
    class ModeloOBJ {
      constructor(gl, geometria, posicion, urlTextura, indice) {
        this.gl = gl;
        this.posicion = posicion;
        this.indice = indice;
        this.textura = loadTexture(gl, urlTextura);
        this.modeloVAO = gl.createVertexArray();
        gl.bindVertexArray(this.modeloVAO);

        let codigoVertices = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, codigoVertices);
        gl.bufferData(gl.ARRAY_BUFFER, geometria.vertices, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);

        let codigoNormales = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, codigoNormales);
        gl.bufferData(gl.ARRAY_BUFFER, geometria.normales, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);

        let codigoTexturas = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, codigoTexturas);
        gl.bufferData(gl.ARRAY_BUFFER, geometria.texturas, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(2);
        gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 0, 0);

        this.conteoVertices = geometria.vertices.length / 3;

        gl.bindVertexArray(null);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);
      }

      dibuja(gl) {
        gl.bindVertexArray(this.modeloVAO);
        
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, this.textura);
        gl.uniform1i(gl.getUniformLocation(gl.getParameter(gl.CURRENT_PROGRAM), "uSampler"), 0);
        
        gl.drawArrays(gl.TRIANGLES, 0, this.conteoVertices);
        gl.bindVertexArray(null);
      }
    }

    // Shaders
    function compilaEnlazaLosShaders() {
      let shaderDeVertice = gl.createShader(gl.VERTEX_SHADER);
      gl.shaderSource(shaderDeVertice, document.getElementById("vs").text.trim());
      gl.compileShader(shaderDeVertice);
      if (!gl.getShaderParameter(shaderDeVertice, gl.COMPILE_STATUS)) {
         console.error(gl.getShaderInfoLog(shaderDeVertice));
      }

      let shaderDeFragmento = gl.createShader(gl.FRAGMENT_SHADER);
      gl.shaderSource(shaderDeFragmento, document.getElementById("fs").text.trim());
      gl.compileShader(shaderDeFragmento);
      if (!gl.getShaderParameter(shaderDeFragmento, gl.COMPILE_STATUS)) {
         console.error(gl.getShaderInfoLog(shaderDeFragmento));
      }

      programaID = gl.createProgram();
      gl.attachShader(programaID, shaderDeVertice); 
      gl.attachShader(programaID, shaderDeFragmento);
      gl.linkProgram(programaID);
      if (!gl.getProgramParameter(programaID, gl.LINK_STATUS)) {
         console.error(gl.getProgramInfoLog(programaID));
      }

      gl.useProgram(programaID);
    }

    // Transformaciones
    function toRadians(grados) {
      return grados * Math.PI / 180;
    }

    function identidad(r) {
      r[0] = 1; r[4] = 0; r[ 8] = 0; r[12] = 0;
      r[1] = 0; r[5] = 1; r[ 9] = 0; r[13] = 0;
      r[2] = 0; r[6] = 0; r[10] = 1; r[14] = 0;
      r[3] = 0; r[7] = 0; r[11] = 0; r[15] = 1;
    }

    function traslacion(matriz, tx, ty, tz) {
      let r = new Array(16);
      r[0] = 1; r[4] = 0; r[ 8] = 0; r[12] = tx;
      r[1] = 0; r[5] = 1; r[ 9] = 0; r[13] = ty;
      r[2] = 0; r[6] = 0; r[10] = 1; r[14] = tz;
      r[3] = 0; r[7] = 0; r[11] = 0; r[15] =  1;
      multiplica(matriz, matriz, r);
    }

    function escalacion(matriz, sx, sy, sz) { 
      let r = new Array(16);
      r[0] = sx; r[4] =  0; r[ 8] =  0; r[12] =  0;
      r[1] =  0; r[5] = sy; r[ 9] =  0; r[13] =  0;
      r[2] =  0; r[6] =  0; r[10] = sz; r[14] =  0;
      r[3] =  0; r[7] =  0; r[11] =  0; r[15] =  1;
      multiplica(matriz, matriz, r);
    }

    function rotacionX(matriz, theta){
      let r = new Array(16);
      let c = Math.cos(toRadians(theta));
      let s = Math.sin(toRadians(theta));
      r[0] =  1; r[4] =  0; r[ 8] =  0; r[12] = 0;
      r[1] =  0; r[5] =  c; r[ 9] = -s; r[13] = 0;
      r[2] =  0; r[6] =  s; r[10] =  c; r[14] = 0;
      r[3] =  0; r[7] =  0; r[11] =  0; r[15] = 1;
      multiplica(matriz, matriz, r); 
    }

    function rotacionY(matriz, theta){
      let r = new Array(16);
      let c = Math.cos(toRadians(theta));
      let s = Math.sin(toRadians(theta));
      r[0] =  c; r[4] =  0; r[ 8] =  s; r[12] = 0;
      r[1] =  0; r[5] =  1; r[ 9] =  0; r[13] = 0;
      r[2] = -s; r[6] =  0; r[10] =  c; r[14] = 0;
      r[3] =  0; r[7] =  0; r[11] =  0; r[15] = 1;
      multiplica(matriz, matriz, r);
    }

    function rotacionZ(matriz, theta){
      let r = new Array(16);
      let c = Math.cos(toRadians(theta));
      let s = Math.sin(toRadians(theta));
      r[0] =  c; r[4] = -s; r[ 8] =  0; r[12] = 0;
      r[1] =  s; r[5] =  c; r[ 9] =  0; r[13] = 0;
      r[2] =  0; r[6] =  0; r[10] =  1; r[14] = 0;
      r[3] =  0; r[7] =  0; r[11] =  0; r[15] = 1;
      multiplica(matriz, matriz, r);
    }

    function perspective(r, fovy, aspecto, cerca, lejos) {
      let ang = fovy * 0.5;
      let f = (Math.abs(Math.sin(toRadians(ang))) < 1e-8 ? 0 : 1) / Math.tan(toRadians(ang));
      r[0] = f/aspecto; r[4] = 0; r[ 8] =                                  0; r[12] =                                       0;
      r[1] =         0; r[5] = f; r[ 9] =                                  0; r[13] =                                       0;
      r[2] =         0; r[6] = 0; r[10] = -(lejos + cerca) / (lejos - cerca); r[14] =  -2.0 * lejos * cerca / (lejos - cerca);
      r[3] =         0; r[7] = 0; r[11] =                              - 1.0; r[15] =                                       0;
    }

    function lookAt(matriz, eyeX, eyeY, eyeZ, centerX, centerY, centerZ, upX, upY, upZ) {
      let fx = centerX - eyeX;
      let fy = centerY - eyeY;
      let fz = centerZ - eyeZ;
      let rlf = 1.0 / Math.sqrt(fx*fx + fy*fy + fz*fz);
      fx *= rlf; fy *= rlf; fz *= rlf;

      let sx = fy * upZ - fz * upY;
      let sy = fz * upX - fx * upZ;
      let sz = fx * upY - fy * upX;
      let rls = 1.0 / Math.sqrt(sx*sx + sy*sy + sz*sz);
      sx *= rls; sy *= rls; sz *= rls;

      let ux = sy * fz - sz * fy;
      let uy = sz * fx - sx * fz;
      let uz = sx * fy - sy * fx;

      matriz[0] = sx; matriz[4] = ux; matriz[ 8] = -fx; matriz[12] = 0;
      matriz[1] = sy; matriz[5] = uy; matriz[ 9] = -fy; matriz[13] = 0;
      matriz[2] = sz; matriz[6] = uz; matriz[10] = -fz; matriz[14] = 0;
      matriz[3] = 0;  matriz[7] = 0;  matriz[11] =   0; matriz[15] = 1;

      traslacion(matriz, -eyeX, -eyeY, -eyeZ);
    }

    function multiplica(c, a, b) {
      let r = new Array(16);
      let i, j, k;
      for (i = 0; i < 4; i++){
        for (j = 0; j < 4; j++){
          let s = 0;
          for (k = 0; k < 4; k++)
            s = s + a[i + k * 4] * b[k + j * 4];
            r[i + j * 4] = s;
          }
        }
      for (i = 0; i < 16; i++)
        c[i] = r[i];
    }

    // Vector3
    class Vector3 {
      constructor(x, y, z) {
        this.x = x || 0;
        this.y = y || 0;
        this.z = z || 0;
      }

      producto_vectorial(v2) {
        let r = new Vector3();
        r.x = (this.y * v2.z) - (this.z * v2.y);
        r.y = (this.z * v2.x) - (this.x * v2.z);
        r.z = (this.x * v2.y) - (this.y * v2.x);
        return r;
      }

      producto_escalar(v2) {
        return (this.x * v2.x) + (this.y * v2.y) + (this.z * v2.z);
      }

      longitud() {
        return (Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z));
      }
    }
  
    // ArcBall 
    class ArcBall {
      constructor(w, h) {
        this.Epsilon = 1.0e-5;
        this.U = new Vector3();
        this.V = new Vector3();
        this.ajusta(w, h);
      }

      ajusta(w, h) {
        if (!((w > 1.0) && (h > 1.0)))
          console.error("ERROR en ArcBall.ajusta");

        this.ajustaAncho = 2.0 / (w - 1.0);
        this.ajustaAlto = 2.0 / (h - 1.0);
      }

      obtieneVector(vector, x, y) {
        let tempX = (x * this.ajustaAncho) - 1.0;
        let tempY = 1.0 - (y * this.ajustaAlto);

        let longitud2 = (tempX * tempX) + (tempY * tempY);

        if (longitud2 > 1.0) {
          let norma = (1.0 / Math.sqrt(longitud2));
          vector.x = tempX * norma;
          vector.y = tempY * norma;
          vector.z = 0.0;
        } else {
          vector.x = tempX;
          vector.y = tempY;
          vector.z = Math.sqrt(1.0 - longitud2);
        }
      }

      primerPunto(x, y) {
        this.obtieneVector(this.U, x, y);
      }

      segundoPunto(x, y) {
        let q = { x: 0, y: 0, z: 0, w: 0 };
        this.obtieneVector(this.V, x, y);

        let Normal = this.U.producto_vectorial(this.V);

        if (Normal.longitud() > this.Epsilon) {
          q.x = Normal.x;
          q.y = Normal.y;
          q.z = Normal.z;
          q.w = this.U.producto_escalar(this.V);
        } else {
          q.x = q.y = q.z = q.w = 0.0;
        }
        return q;
      }
    }

    // Cuaternio
    function rotaConCuaternion(a, q) {
      let d, s;
      d = (q.x * q.x) + (q.y * q.y) + (q.z * q.z) + (q.w * q.w);
      s = (d > 0.0) ? (2.0 / d) : 0.0;
      a[0] =  1.0 - (q.y*q.y + q.z*q.z) * s; a[4] =        (q.x*q.y - q.w*q.z) * s; a[8]  =        (q.x*q.z + q.w*q.y) * s; a[12] = 0;
      a[1] =        (q.x*q.y + q.w*q.z) * s; a[5] = 1.0  - (q.x*q.x + q.z*q.z) * s; a[9]  =        (q.y*q.z - q.w*q.x) * s; a[13] = 0;
      a[2] =        (q.x*q.z - q.w*q.y) * s; a[6] =        (q.y*q.z + q.w*q.x) * s; a[10] = 1.0  - (q.x*q.x + q.y*q.y) * s; a[14] = 0;
      a[3] =                              0; a[7] =                              0; a[11] =                              0; a[15] = 1;
    }

    // Eventos del Ratón - MODIFICADO PARA ROTACIÓN Y TRASLACIÓN
    function mouseDown(event) {
      const rect = canvas.getBoundingClientRect();
      let posx = event.clientX - rect.left;
      let posy = event.clientY - rect.top;

      // Clic izquierdo - Rotación
      if (event.button === 0) {
        const tercio = canvas.width / 3;
        if (posx < tercio) {
          modeloSeleccionado = 0; // Fall Guys (izquierda)
        } else if (posx < tercio * 2) {
          modeloSeleccionado = 1; // Castle (centro)
        } else {
          modeloSeleccionado = 2; // Knight (derecha)
        }

        B = MatricesRotacion[modeloSeleccionado].slice();
        arcBall.primerPunto(posx, posy);
        boton_izq_presionado = true;
      }
      // Clic derecho - Traslación
      else if (event.button === 2) {
        posicionInicialRatonX = posx;
        posicionInicialRatonY = posy;
        boton_der_presionado = true;
        
        // Guardar posiciones iniciales de todos los modelos
        for (let i = 0; i < modelos.length; i++) {
          posicionesInicialesModelos[i] = [...modelos[i].posicion];
        }
      }
      
      event.preventDefault();
      return false;
    }

    function mouseUp(e){
      boton_izq_presionado = false;
      boton_der_presionado = false;
    }

    function mouseMove(event) {
      const rect = canvas.getBoundingClientRect();
      let posx = event.clientX - rect.left;
      let posy = event.clientY - rect.top;

      // Rotación con clic izquierdo
      if (boton_izq_presionado) {
        let q = arcBall.segundoPunto(posx, posy);
        rotaConCuaternion(MatricesRotacion[modeloSeleccionado], q);
        multiplica(MatricesRotacion[modeloSeleccionado], MatricesRotacion[modeloSeleccionado], B);
      }
      // Traslación con clic derecho
      else if (boton_der_presionado) {
        const deltaX = (posx - posicionInicialRatonX) * 0.01;
        const deltaY = -(posy - posicionInicialRatonY) * 0.01; // Negativo porque Y va hacia arriba
        
        // Mover todos los modelos juntos
        for (let i = 0; i < modelos.length; i++) {
          modelos[i].posicion[0] = posicionesInicialesModelos[i][0] + deltaX;
          modelos[i].posicion[1] = posicionesInicialesModelos[i][1] + deltaY;
        }
      }
      
      event.preventDefault();
    }

    function mouseWheel(event) {
      event.preventDefault();
      if (event.deltaY < 0) {
        distanciaCamara = Math.max(3, distanciaCamara - VELOCIDAD_ZOOM * 3);
      } else {
        distanciaCamara = Math.min(30, distanciaCamara + VELOCIDAD_ZOOM * 3);
      }
      return false;
    }

    //Funciones de Animación - MODIFICADAS
    function actualizaBotonActivo(idBoton, activo) {
      const boton = document.getElementById(idBoton);
      if (boton) {
        if (activo) {
          boton.classList.add('activo');
        } else {
          boton.classList.remove('activo');
        }
      }
    }

    function animarCamaraArriba() {
      camaraArribaActiva = !camaraArribaActiva;
      actualizaBotonActivo('rotarArriba', camaraArribaActiva);
    }

    function animarCamaraAbajo() {
      camaraAbajoActiva = !camaraAbajoActiva;
      actualizaBotonActivo('rotarAbajo', camaraAbajoActiva);
    }

    function animarCamaraIzquierda() {
      camaraIzquierdaActiva = !camaraIzquierdaActiva;
      actualizaBotonActivo('rotarIzquierda', camaraIzquierdaActiva);
    }

    function animarCamaraDerecha() {
      camaraDerechaActiva = !camaraDerechaActiva;
      actualizaBotonActivo('rotarDerecha', camaraDerechaActiva);
    }

    function animarZoomIn() {
      zoomInActivo = !zoomInActivo;
      actualizaBotonActivo('zoomIn', zoomInActivo);
    }

    function animarZoomOut() {
      zoomOutActivo = !zoomOutActivo;
      actualizaBotonActivo('zoomOut', zoomOutActivo);
    }

    // Rotaciones individuales
    function animarRotacionFallGuysX() {
      rotarFallGuysXActivo = !rotarFallGuysXActivo;
      actualizaBotonActivo('rotarFallGuysX', rotarFallGuysXActivo);
    }

    function animarRotacionFallGuysY() {
      rotarFallGuysYActivo = !rotarFallGuysYActivo;
      actualizaBotonActivo('rotarFallGuysY', rotarFallGuysYActivo);
    }

    function animarRotacionFallGuysZ() {
      rotarFallGuysZActivo = !rotarFallGuysZActivo;
      actualizaBotonActivo('rotarFallGuysZ', rotarFallGuysZActivo);
    }

    function animarRotacionCastleX() {
      rotarCastleXActivo = !rotarCastleXActivo;
      actualizaBotonActivo('rotarCastleX', rotarCastleXActivo);
    }

    function animarRotacionCastleY() {
      rotarCastleYActivo = !rotarCastleYActivo;
      actualizaBotonActivo('rotarCastleY', rotarCastleYActivo);
    }

    function animarRotacionCastleZ() {
      rotarCastleZActivo = !rotarCastleZActivo;
      actualizaBotonActivo('rotarCastleZ', rotarCastleZActivo);
    }

    function animarRotacionKnightX() {
      rotarKnightXActivo = !rotarKnightXActivo;
      actualizaBotonActivo('rotarKnightX', rotarKnightXActivo);
    }

    function animarRotacionKnightY() {
      rotarKnightYActivo = !rotarKnightYActivo;
      actualizaBotonActivo('rotarKnightY', rotarKnightYActivo);
    }

    function animarRotacionKnightZ() {
      rotarKnightZActivo = !rotarKnightZActivo;
      actualizaBotonActivo('rotarKnightZ', rotarKnightZActivo);
    }

    function actualizarCamara() {
      let radianes_h = toRadians(anguloHorizontal);
      let radianes_v = toRadians(anguloVertical);
      
      let camX = distanciaCamara * Math.cos(radianes_v) * Math.sin(radianes_h);
      let camY = distanciaCamara * Math.sin(radianes_v);
      let camZ = distanciaCamara * Math.cos(radianes_v) * Math.cos(radianes_h);

      identidad(MatrizVista);
      lookAt(MatrizVista, camX, camY, camZ, 0, 0, 0, 0, 1, 0);
      gl.uniformMatrix4fv(uMatrizVista, false, MatrizVista);
    }

    // Loop de Renderizado
    function dibuja() {
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      if (modelos.length === 0) {
        requestAnimationFrame(dibuja);
        return;
      }
     
      // Nuevas rotaciones individuales
      if (rotarFallGuysXActivo) rotacionesModelos[0].x += VELOCIDAD_ROTACION;
      if (rotarFallGuysYActivo) rotacionesModelos[0].y += VELOCIDAD_ROTACION;
      if (rotarFallGuysZActivo) rotacionesModelos[0].z += VELOCIDAD_ROTACION;
      if (rotarCastleXActivo) rotacionesModelos[1].x += VELOCIDAD_ROTACION;
      if (rotarCastleYActivo) rotacionesModelos[1].y += VELOCIDAD_ROTACION;
      if (rotarCastleZActivo) rotacionesModelos[1].z += VELOCIDAD_ROTACION;
      if (rotarKnightXActivo) rotacionesModelos[2].x += VELOCIDAD_ROTACION;
      if (rotarKnightZActivo) rotacionesModelos[2].z += VELOCIDAD_ROTACION;
      if (rotarKnightYActivo) rotacionesModelos[2].y += VELOCIDAD_ROTACION;
      
      if (zoomInActivo) distanciaCamara = Math.max(3, distanciaCamara - VELOCIDAD_ZOOM);
      if (zoomOutActivo) distanciaCamara = Math.min(30, distanciaCamara + VELOCIDAD_ZOOM);
      
      if (camaraArribaActiva) {
        anguloVertical -= VELOCIDAD_CAMARA;
        if (anguloVertical < -89) anguloVertical = -89;
      }
      if (camaraAbajoActiva) {
        anguloVertical += VELOCIDAD_CAMARA;
        if (anguloVertical > 89) anguloVertical = 89;
      }
      if (camaraIzquierdaActiva) anguloHorizontal += VELOCIDAD_CAMARA;
      if (camaraDerechaActiva) anguloHorizontal -= VELOCIDAD_CAMARA;

      for (let i = 0; i < 3; i++) {
        if (rotacionesModelos[i].x >= 360) rotacionesModelos[i].x -= 360;
        if (rotacionesModelos[i].y >= 360) rotacionesModelos[i].y -= 360;
        if (rotacionesModelos[i].z >= 360) rotacionesModelos[i].z -= 360;
      }

      actualizarCamara();

      for (let i = 0; i < modelos.length; i++) {
        const modelo = modelos[i];
        
        identidad(MatrizModelo);
        traslacion(MatrizModelo, modelo.posicion[0], modelo.posicion[1], modelo.posicion[2]);
        escalacion(MatrizModelo, modelo.escala[0], modelo.escala[1], modelo.escala[2]);
        
        rotacionX(MatrizModelo, rotacionesModelos[i].x);
        rotacionY(MatrizModelo, rotacionesModelos[i].y);
        rotacionZ(MatrizModelo, rotacionesModelos[i].z);
        
        multiplica(MatrizModelo, MatrizModelo, MatricesRotacion[i]);
        
        gl.uniformMatrix4fv(uMatrizModelo, false, MatrizModelo);
        modelo.dibuja(gl);
      }

      requestAnimationFrame(dibuja);
    }

    function reinicia() {
      for (let i = 0; i < 3; i++) {
        identidad(MatricesRotacion[i]);
        rotacionesModelos[i] = { x: 0, y: 0, z: 0 };
        // Restaurar posiciones originales
        if (modelos[i]) {
          modelos[i].posicion = [...posicionesInicialesModelos[i]];
        }
      }
      
      anguloVertical = 0;
      anguloHorizontal = 0;
      distanciaCamara = 8;
      rotarFallGuysXActivo = false;
      rotarFallGuysYActivo = false;
      rotarFallGuysZActivo = false;
      rotarCastleXActivo = false;
      rotarCastleYActivo = false;
      rotarCastleZActivo = false;
      rotarKnightXActivo = false;
      rotarKnightYActivo = false;
      rotarKnightZActivo = false;
      zoomInActivo = false;
      zoomOutActivo = false;
      camaraArribaActiva = false;
      camaraAbajoActiva = false;
      camaraIzquierdaActiva = false;
      camaraDerechaActiva = false;
      modeloSeleccionado = 0;
      
      document.querySelectorAll('button.activo').forEach(btn => {
        btn.classList.remove('activo');
      });
    }

    // Inicialización
    async function main() {
      canvas = document.getElementById("webglcanvas");
      gl = canvas.getContext("webgl2");
      if (!gl) {
         document.write("WebGL 2.0 no está disponible en tu navegador");
         return;
      }

      canvas.addEventListener("mousedown", mouseDown, false);
      canvas.addEventListener("mouseup", mouseUp, false);
      canvas.addEventListener("mouseout", mouseUp, false);
      canvas.addEventListener("mousemove", mouseMove, false);
      canvas.addEventListener("wheel", mouseWheel, false);
      
      // Prevenir el menú contextual del clic derecho
      canvas.addEventListener('contextmenu', function(event) {
        event.preventDefault();
        return false;
      });

      document.getElementById("reset").onclick = reinicia;
      document.getElementById("rotarArriba").onclick = animarCamaraArriba;
      document.getElementById("rotarAbajo").onclick = animarCamaraAbajo;
      document.getElementById("rotarIzquierda").onclick = animarCamaraIzquierda;
      document.getElementById("rotarDerecha").onclick = animarCamaraDerecha;
      document.getElementById("zoomIn").onclick = animarZoomIn;
      document.getElementById("zoomOut").onclick = animarZoomOut;
      
      // eventos para rotaciones individuales
      document.getElementById("rotarFallGuysX").onclick = animarRotacionFallGuysX;
      document.getElementById("rotarFallGuysY").onclick = animarRotacionFallGuysY;
      document.getElementById("rotarFallGuysZ").onclick = animarRotacionFallGuysZ;
      document.getElementById("rotarCastleX").onclick = animarRotacionCastleX;
      document.getElementById("rotarCastleY").onclick = animarRotacionCastleY;
      document.getElementById("rotarCastleZ").onclick = animarRotacionCastleZ;
      document.getElementById("rotarKnightX").onclick = animarRotacionKnightX;
      document.getElementById("rotarKnightY").onclick = animarRotacionKnightY;
      document.getElementById("rotarKnightZ").onclick = animarRotacionKnightZ;

      gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
      compilaEnlazaLosShaders();

      arcBall = new ArcBall(canvas.width, canvas.height);

      gl.useProgram(programaID);
      uMatrizProyeccion = gl.getUniformLocation(programaID, "uMatrizProyeccion");
      uMatrizVista = gl.getUniformLocation(programaID, "uMatrizVista");
      uMatrizModelo = gl.getUniformLocation(programaID, "uMatrizModelo");
      
      perspective(MatrizProyeccion, 45, canvas.width / canvas.height, 0.1, 100);
      gl.uniformMatrix4fv(uMatrizProyeccion, false, MatrizProyeccion);
      
      identidad(MatrizVista);
      gl.uniformMatrix4fv(uMatrizVista, false, MatrizVista);
      
      for (let i = 0; i < 3; i++) {
        identidad(MatricesRotacion[i]);
      }

      arcBall.ajusta(gl.canvas.width, gl.canvas.height);

      gl.enable(gl.DEPTH_TEST);
      gl.clearColor(0, 0, 0, 0);

      const loader = new OBJLoader();
      const modelosConfig = [
        { 
          obj: 'modelos/fall_guys_1.obj', 
          mtl: 'modelos/fall_guys_1.mtl', 
          posicion: [-3, -2.0, 0],
          escala: [1, 1, 1]
        },
        { 
          obj: 'modelos/castle.obj', 
          mtl: 'modelos/castle.mtl', 
          posicion: [0, -1.0, 0],
          escala: [1, 1, 1]
        },
        { 
          obj: 'modelos/chr_knight.obj', 
          mtl: 'modelos/chr_knight.mtl', 
          posicion: [3, -1.0, 0],
          escala: [1, 1, 1]
        }
      ];

      let cargados = 0;
      const loadingEl = document.getElementById('loading');

      try {
        for (let i = 0; i < modelosConfig.length; i++) {
          const config = modelosConfig[i];
          if (loadingEl) {
            loadingEl.textContent = `Cargando modelo ${i + 1} de 3...`;
          }
          
          try {
            const geometria = await loader.load(config.obj, config.mtl);
            
            const nombreMaterial = Object.keys(geometria.materiales)[0];
            const datosMaterial = geometria.materiales[nombreMaterial];
            const urlTextura = datosMaterial.map_Kd ? 'modelos/' + datosMaterial.map_Kd : null;
            
            const modelo = new ModeloOBJ(gl, geometria, config.posicion, urlTextura, i);
            modelo.escala = config.escala || [1, 1, 1];
            modelos.push(modelo);
            cargados++;
            console.log(`✓ Modelo ${i + 1} cargado correctamente`);
          } catch (error) {
            console.error(`✗ Error al cargar modelo ${i + 1}:`, error);
          }
        }

        if (cargados > 0) {
          if (loadingEl) loadingEl.style.display = 'none';
          console.log(`✓ Total: ${cargados} modelos cargados`);
        } else {
          if (loadingEl) {
            loadingEl.innerHTML = 
              '❌ No se pudieron cargar los modelos<br><br>' +
              'Verifica:<br>' +
              '1. Que los archivos .obj, .mtl y .png estén en la carpeta "modelos/"<br>' +
              '2. Que los nombres coincidan con los especificados en el código<br>' +
              '3. Que estés usando un servidor local (no file://)';
          }
        }
      } catch (error) {
        console.error('Error general:', error);
        if (loadingEl) {
          loadingEl.textContent = 'Error: ' + error.message;
        }
      }

      dibuja();
    }

    window.onload = main;
  </script>
